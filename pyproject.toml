[project]
name = "calorie-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai==2.33.0",
    "matplotlib>=3.11.2",
    "pydantic>=2",
    "python-telegram-bot[job-queue]==22.8",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
